# nginx (hôte) — Prière & Coran sur salawat.dimatlas.com
# À installer dans /etc/nginx/sites-available/salawat.dimatlas.com, puis :
#   ln -s ../sites-available/salawat.dimatlas.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d salawat.dimatlas.com      # ajoute le bloc HTTPS
server {
    server_name salawat.dimatlas.com;
    listen 80;
    listen [::]:80;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Écoute audio : requêtes Range / pas de mise en tampon de gros fichiers
        proxy_request_buffering off;
    }
}
