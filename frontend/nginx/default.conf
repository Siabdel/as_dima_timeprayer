# nginx — configuration du frontend « Prière & Coran » (stage prod).
# Sert le build statique, proxifie /api/ vers le backend Django et
# renvoie toute route inconnue vers index.html (SPA).

# Schéma vu par le client : transmis par le proxy TLS en amont (Caddy / nginx
# hôte), sinon schéma de la connexion. Évite une boucle de redirections HTTPS
# côté Django (SECURE_SSL_REDIRECT).
map $http_x_forwarded_proto $pc_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip des ressources textuelles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # API : proxifiée vers le backend (jamais mise en cache par le service worker)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pc_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Fichiers statiques Django (admin) : servis par nginx depuis le volume partagé
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 7d;
    }

    # Administration Django (optionnel — à désactiver si non souhaitée)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pc_forwarded_proto;
    }

    # Healthcheck (utilisé par les sondes de monitoring)
    location /health/ {
        proxy_pass http://backend:8000/health/;
        access_log off;
    }

    # Application monopage : toute route non trouvée bascule sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
