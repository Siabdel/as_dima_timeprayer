# =============================================================================
# Prière & Coran — Environnement de développement local
# Usage : cp .env.example .env && docker compose up --build
# =============================================================================

name: dimatimeprayer

services:
  # --- PostgreSQL 16 ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prayer_coran}
      POSTGRES_USER: ${POSTGRES_USER:-prayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prayer_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposé uniquement pour le debug local (pgAdmin, psql…). Jamais en prod.
      # NB : port hôte décalé à 25432 (5432/5433 occupés par d'autres projets locaux).
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prayer} -d ${POSTGRES_DB:-prayer_coran}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redis : cache Django (db 0), broker Celery (db 1), results (db 2) -----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      # NB : port hôte décalé à 26379 (6379/6380 occupés par d'autres projets locaux).
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Backend Django (runserver en dev) -------------------------------------
  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    # Aligné sur l'UID/GID de l'hôte : indispensable pour écrire dans le volume
    # monté (migrations, cache SQLite de test, __pycache__).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1001}"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app:rw
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Worker Celery : les deux files (default + notifications) --------------
  worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1001}"
    command: >
      celery -A config worker
      -Q default,notifications
      -c 4
      -l info
      --max-tasks-per-child=100
    volumes:
      - ./backend:/app:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Celery Beat : tâches périodiques (re-planification quotidienne, etc.) -
  beat:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1001}"
    # Le planificateur est écrit dans /tmp pour éviter les conflits de droits
    # avec le volume monté (en prod, on passera au DatabaseScheduler).
    command: >
      celery -A config beat
      -l info
      --schedule=/tmp/celerybeat-schedule
      --pidfile=/tmp/celerybeat.pid
    volumes:
      - ./backend:/app:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Frontend Vue 3 + Vite (HMR en dev) ------------------------------------
  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app:rw
      # node_modules vit dans un volume nommé : évite les conflits de binaires
      # natifs entre l'hôte (macOS/Windows) et le conteneur Linux.
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
